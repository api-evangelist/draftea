aid: draftea
name: Draftea
description: >-
  Draftea is a Mexico-based daily fantasy sports and real-money sports gaming
  platform, billed as the first daily fantasy sports (DFS) product for the
  Spanish-speaking world. Fans draft lineups of real athletes across soccer,
  American football (via an NFL partnership), basketball, baseball, and Formula 1,
  enter paid contests, and compete against other users for cash prizes rather than
  against a bookmaker. The company operates in Mexico under regulatory approval
  (DGAJS/SCEVF/P-06/2005-TER), distributes through native iOS and Android apps,
  and is backed by Sequoia, Kaszek, Bullpen Capital, Stepstone Group, and Courtside
  Ventures, along with athlete investors. Draftea is a consumer product company and
  does not currently publish a public developer API program; this profile captures
  its public web, support, legal, and open-source engineering surface.
